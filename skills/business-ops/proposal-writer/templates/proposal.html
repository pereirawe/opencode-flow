<!DOCTYPE html>
<html lang="{{DOC_LANG}}">
<head>
<meta charset="utf-8">
<title>{{PROPOSAL_TITLE}}</title>
<style>
  /* Proposal Design Standard — reference template.
     Adapt CONTENT only. Never rewrite this CSS from scratch.
     A4, brand header, print-safe system fonts, page-number footer.
     Set {{DOC_LANG}} to the resolved proposal locale (pt/es/en).
     Set {{PROPOSAL_TITLE}}/{{PROPOSAL_SUBTITLE}}; render the body over
     {{PROPOSAL_BODY}} (replace the token — never leave {{…}} tokens).
     Brand header rules (§3.8 of standards/proposal-design.md):
       - full brand: logo left, company block right
       - logo-only or company-only: keep ONE block, anchored left, and REMOVE
         the other side (do not leave an empty space-between layout)
       - no-brand build: REMOVE the whole <header class="brand-header">
         element (an empty header leaves a stray rule on the document) */
  @page {
    size: A4;
    margin: 14mm 16mm 18mm 16mm;
    @bottom-right {
      content: counter(page);
      font-family: Helvetica, Arial, sans-serif;
      font-size: 9px;
      color: #555;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 11.5px;
    line-height: 1.5;
    color: #1a1a1a;
  }
  /* ── Brand header ─────────────────────────────────────────────── */
  .brand-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    padding-bottom: 10px;
    border-bottom: 2px solid #111;
    margin-bottom: 16px;
    break-after: avoid;
  }
  .brand-header img {
    max-height: 46px;
    max-width: 200px;
    object-fit: contain;
  }
  .brand-header .company-block { text-align: right; }
  .brand-header .company-name {
    font-size: 14px; font-weight: bold; margin: 0 0 2px 0;
  }
  .brand-header .company-meta {
    font-size: 10px; color: #444; line-height: 1.4; margin: 0;
  }
  /* ── Document title ───────────────────────────────────────────── */
  h1.proposal-title {
    font-size: 20px; margin: 0 0 4px 0; line-height: 1.2;
  }
  .proposal-sub {
    font-size: 11px; color: #444; margin: 0 0 18px 0;
    display: flex; gap: 12px; flex-wrap: wrap;
  }
  /* ── Sections ─────────────────────────────────────────────────── */
  h2 {
    font-size: 13px; text-transform: uppercase;
    letter-spacing: 0.4px;
    border-bottom: 1px solid #ccc;
    padding-bottom: 3px;
    margin: 18px 0 8px 0;
    break-after: avoid;
  }
  h3 { font-size: 12px; margin: 12px 0 4px 0; }
  p { margin: 4px 0 8px 0; }
  ul, ol { margin: 4px 0 8px 0; padding-left: 18px; }
  li { margin: 2px 0; }
  table { width: 100%; border-collapse: collapse; margin: 8px 0 12px 0; }
  th, td {
    border: 1px solid #ccc;
    padding: 5px 7px;
    text-align: left;
    font-size: 11px;
    orphans: 3; widows: 3;
  }
  th { background: #f2f2f2; font-weight: bold; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .proposal-section {
    break-inside: avoid;
  }
  .muted { color: #555; font-size: 10.5px; }
  .small { font-size: 10px; }
  /* ── Signature block ──────────────────────────────────────────── */
  .signature {
    display: flex; justify-content: space-between; gap: 40px;
    margin-top: 40px; break-inside: avoid;
  }
  .signature .sig-col { flex: 1; text-align: center; }
  .signature .sig-line { border-top: 1px solid #111; margin-top: 46px; padding-top: 4px; }
  @media print {
    body { color: #000; }
    th { background: #eee; }
    a { color: #000; text-decoration: none; }
  }
</style>
</head>
<body>

<!-- ══ Brand header: the agent fills these from company.json/logo ══ -->
<header class="brand-header">
  <div class="logo-block">
    <!-- <img src="logo-relative-path" alt="Company logo"> -->
  </div>
  <div class="company-block">
    <!--
    <p class="company-name">Company name</p>
    <p class="company-meta">contact@… · +58 … · website<br>address line</p>
    -->
  </div>
</header>

<!-- ══ Title block ══ -->
<h1 class="proposal-title">{{PROPOSAL_TITLE}}</h1>
<p class="proposal-sub">
  <span>{{PROPOSAL_SUBTITLE}}</span>
</p>

<!-- ══ Proposal body ══
     The agent renders each canonical proposal section as
     <section class="proposal-section"> with an <h2>. Pricing math must be
     identical to proposal.md. REPLACE {{PROPOSAL_BODY}} with the sections —
     no {{…}} token may remain in the final file (grep gate). -->

{{PROPOSAL_BODY}}

<!-- ══ Signature block (kept only when a hard-copy signature is expected).
     Localize the labels ("Date" → "Fecha"/"Data" etc.) to the proposal
     locale before rendering. ══ -->
<footer class="signature">
  <div class="sig-col">
    <p class="muted">{{COMPANY_SIGNATURE_NAME}}</p>
    <div class="sig-line">Date</div>
  </div>
  <div class="sig-col">
    <p class="muted">{{CLIENT_SIGNATURE_NAME}}</p>
    <div class="sig-line">Date</div>
  </div>
</footer>

</body>
</html>

# opencode nginx reverse proxy — managed by setup-nginx.sh
# HTTP → HTTPS redirect
server {
    listen {HTTP_PORT};
    listen [::]:{HTTP_PORT};
    server_name {HOSTNAME};

    return 301 https://$host$request_uri;
}

# HTTPS reverse proxy to opencode web (127.0.0.1:4096)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name {HOSTNAME};

    ssl_certificate     /etc/opencode/certs/{HOSTNAME}.pem;
    ssl_certificate_key /etc/opencode/certs/{HOSTNAME}-key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    proxy_read_timeout 3600s;

    location / {
        proxy_pass http://127.0.0.1:4096;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

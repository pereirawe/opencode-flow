# build-opencode-image.yml — auto-build the opencode-flow Docker image (BR 12/AC 2)
#
# Trigger: push to main touching the opencode config (the whole repo IS the
# config: opencode.json, agents/, skills/, commands/, scripts/, standards/,
# Dockerfile, VERSION, aibot-repos.json). Pushes to GHCR:
#   ghcr.io/pereirawe/opencode-flow:latest
#   ghcr.io/pereirawe/opencode-flow:v<semver>   (from VERSION)
#
# Secrets: GHCR_TOKEN (PAT with packages:write) or rely on GITHUB_TOKEN with
# packages:write permission configured on the repo.

name: build-opencode-image

on:
  push:
    branches: [main]
    paths:
      - "opencode.json"
      - "aibot-repos.json"
      - "VERSION"
      - "Dockerfile"
      - ".dockerignore"
      - "agents/**"
      - "skills/**"
      - "commands/**"
      - "scripts/**"
      - "standards/**"
      - "workflow.md"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}

      - name: Read VERSION
        id: version
        run: |
          V="$(tr -d '[:space:]' < VERSION)"
          echo "semver=v${V#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/pereirawe/opencode-flow:latest
            ghcr.io/pereirawe/opencode-flow:v${{ steps.version.outputs.semver }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test opencode --version in image
        run: |
          ACTUAL="$(docker run --rm --entrypoint opencode ghcr.io/pereirawe/opencode-flow:latest --version)"
          echo "opencode --version = $ACTUAL"
          test -n "$ACTUAL"

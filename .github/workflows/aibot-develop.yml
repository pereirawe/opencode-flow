# aibot-develop.yml — CI-native entry point for `@aibot:develop` (issue #40)
#
# Trigger: a comment on an ISSUE (never a PR — AC 11) containing the standalone
# token `@aibot:develop`. Runs the full development pipeline HEADLESS inside the
# pre-built opencode-flow image (BR 4/BR 13 — SPIKE passed: opencode run works
# without --attach), creates the MR and posts the standardized aibot message
# (BR 5/6/7). The engine is scripts/run-ci-workflow.sh inside the image.
#
# Gates (engine): author exclusion (BR 15), token (BR 1), allowlist (BR 2),
# locally-tracked issue (BR 3), status re-check (BR 5). Lock: GitHub Actions
# `concurrency` per issue serializes runs (BR 8); parallel repos run on
# separate runners (BR 9). No merge/PR polling — close-requester stays the
# only actor after merge (BR 10 / AC 14).
#
# Secrets/vars:
#   OPENCODE_API_KEY   secret — model API key for the opencode-go provider
#   GH_TOKEN           secret — GitHub token (PAT) for gh + git push
#   AIBOT_ALLOWLIST    variable — space/comma separated allowlisted repos
#   AIBOT_MODEL        variable — model id (default opencode-go/deepseek-v4-flash)
#   AIBOT_IMAGE        variable — image to run (default ghcr.io/pereirawe/opencode-flow:latest)

name: aibot-develop

on:
  issue_comment:
    types: [created]

concurrency:
  # One develop at a time per issue (BR 8); a queued trigger re-checks status
  # in the engine and posts already-in-progress / already-resolved (BR 5).
  group: aibot-develop-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  develop:
    # Only issue comments trigger — PR comments have issue.pull_request set (AC 11).
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    # Security F4: permissions scoped to job level, only what's needed
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout target repo (full history for branch operations)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Run aibot CI engine in the opencode-flow image
        env:
          AIBOT_IMAGE: ${{ vars.AIBOT_IMAGE || 'ghcr.io/pereirawe/opencode-flow:latest' }}
          AIBOT_ALLOWLIST: ${{ vars.AIBOT_ALLOWLIST }}
          AIBOT_MODEL: ${{ vars.AIBOT_MODEL }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          # Security F3: write secrets to a temp env-file to reduce process-list exposure.
          # Security F5: COMMENT_BODY is NOT passed as a CLI arg; the script reads it
          # from the COMMENT_BODY env var via --env-file (line 67 of run-ci-workflow.sh).
          ENV_FILE=$(mktemp /tmp/aibot-env.XXXXXX)
          trap 'rm -f "$ENV_FILE"' EXIT

          # Use printf to avoid heredoc expansion issues with special characters.
          printf '%s\n' \
            "AIBOT_ALLOWLIST=${AIBOT_ALLOWLIST}" \
            "AIBOT_MODEL=${AIBOT_MODEL}" \
            "OPENCODE_API_KEY=${OPENCODE_API_KEY}" \
            "GH_TOKEN=${GH_TOKEN}" \
            "COMMENT_AUTHOR=${COMMENT_AUTHOR}" \
            "COMMENT_BODY=${COMMENT_BODY}" \
            "ISSUE_NUMBER=${ISSUE_NUMBER}" \
            > "$ENV_FILE"

          # DevOps B1: container runs as non-root `opencode` user; config lives at
          # /home/opencode/.config/opencode/. Security F2: --read-only rootfs,
          # --tmpfs for /tmp, all Linux capabilities dropped.
          docker run --rm \
            --read-only \
            --tmpfs /tmp:size=100M \
            --cap-drop ALL \
            -v "${{ github.workspace }}":/workspace \
            --env-file "$ENV_FILE" \
            "$AIBOT_IMAGE" \
            /home/opencode/.config/opencode/scripts/run-ci-workflow.sh \
            --workspace /workspace \
            --issue "$ISSUE_NUMBER" \
            --author "$COMMENT_AUTHOR"
